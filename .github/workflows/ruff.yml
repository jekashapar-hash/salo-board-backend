name: Lint and Format

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Ruff with Reviewdog
        uses: reviewdog/action-ruff@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          filter_mode: added # Only report errors in changed lines
          # We still use uv for formatting and local checks, 
          # but reviewdog handles the PR feedback loop for linting.

      - name: Run Ruff Format
        run: uv run ruff format --check .
