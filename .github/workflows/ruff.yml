name: Lint and Format

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "django-insecure-test-key-for-ci"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Run Ruff with Reviewdog
        uses: benny123tw/action-ruff@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added # Only report errors in changed lines
          # benny123tw/action-ruff uses uv internally for linting.

      - name: Run Ruff Format
        run: uv run ruff format --check .
