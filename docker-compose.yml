services:
  redis:
    image: redis:7-alpine
    container_name: saloboard_redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: saloboard_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - db_data:/app/db
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: saloboard_worker
    command: celery -A saloboard worker -l info
    volumes:
      - .:/app
      - db_data:/app/db
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery_beat:
    build: .
    container_name: saloboard_beat
    command: celery -A saloboard beat -l info
    volumes:
      - .:/app
      - db_data:/app/db
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

volumes:
  db_data:
